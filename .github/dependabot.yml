version: 2
updates:
  # Application dependencies (pnpm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-eslint/*']
      wallet:
        patterns: ['@wagmi/*', 'viem', '@reown/*', '@walletconnect/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*']
    # Angular major upgrades should be manual
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']

  # Dagger module dependencies
  - package-ecosystem: npm
    directory: /.dagger
    schedule:
      interval: weekly

  # GitHub Actions — only three workflows are left on Actions after the
  # Woodpecker port (codeql, semgrep, version-bump); this keeps their action
  # pins fresh. It does NOT see .woodpecker/ — Dependabot has no Woodpecker
  # ecosystem, so the images pinned there (kalapaja/dagger-client,
  # ghcr.io/gitleaks/gitleaks, alpine, woodpeckerci/plugin-git) are bumped by
  # hand alongside .tool-versions. See docs/woodpecker-ci.md.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
